<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniTrack : Lost and Found System</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
/* Override / Add project-detail styles */
.project-detail {
  max-width: 1200px;
  margin: 50px auto;
  color: #fff;
  padding: 0 20px;
}

/* Horizontal scroll container */
.project-images {
  display: flex;
  gap: 20px;
  overflow-x: auto;
  padding-bottom: 10px;
  scroll-behavior: smooth;
}

.project-images img {
  min-width: 600px;
  border-radius: 15px;
  height: auto;
  flex-shrink: 0;
  width: 20%;          /* reduce width */
  max-width: 1000px;    /* optional max width */
  height: auto;        /* maintain aspect ratio */
  border-radius: 14px;
  margin: 20px 0;
  gap:20px;
}

/* Project text */
.project-detail p {
  margin-top: 20px;
  font-size: 1.1rem;
  line-height: 1.6;
}

/* Back button */
.back-btn {
  display: inline-block;
  margin-top: 20px;
  padding: 10px 20px;
  background-color: #7c3aed;
  color: #fff;
  text-decoration: none;
  border-radius: 8px;
  transition: background 0.3s ease;
}

.back-btn:hover {
  background-color: #ed5fd8;
}
</style>
</head>
<body>

<header>
  <div class="header-container">
    <div class="logo">Alesya</div>
    <nav class="nav-links">
      <a href="index.html#home">Home</a>
    </nav>
  </div>
</header>

<main class="project-detail">
  <h1>EVent Management System</h1>
  
  <!-- Horizontal scroll container -->
  <div class="project-images">
    <img src="assets/images/project3_signup.png" alt="screenshot 1">
    <img src="assets/images/project3.png" alt="screenshot 2">
    <img src="assets/images/project3(1).png" alt=" screenshot 3">
    <img src="assets/images/project3(2).png" alt="screenshot 4">
    <img src="assets/images/project3(3).png" alt="screenshot 5">
    <img src="assets/images/project3(4).png" alt="screenshot 6">
    <img src="assets/images/project3(5).png" alt="screenshot 7">
    <img src="assets/images/project3(6).png" alt="screenshot 8">
    <img src="assets/images/project3(7).png" alt="screenshot 9">
  </div>

  <p>This is my ITT588(FRONT_END) project. It allows users to browse upcoming events, register or RSVP, and view event details. </p>
  
  <a href="index.html#projects" class="back-btn">← Back to Projects</a>
</main>

</body>
</html>
